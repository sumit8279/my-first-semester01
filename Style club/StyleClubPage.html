<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club</title>
    <style>
        :root {
            --navy: #17243a;
            --gold: #c49a4a;
            --page: #f4f2ed;
            --card: #ffffff;
            --text: #283448;
            --muted: #667085;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--page);
            color: var(--text);
            line-height: 1.6;
            padding: 30px;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 6px;
            font-family: Georgia, serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        #hero {
            background: var(--navy);
            color: white;
            text-align: center;
            padding: 42px 20px;
            border-bottom: 4px solid var(--gold);
        }

        #hero p {
            color: #e4d5b2;
            letter-spacing: 1px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 22px;
            margin-top: 24px;
        }

        .card {
            padding: 24px;
            background: var(--card);
            border: 1px solid #e1ded6;
            border-top: 3px solid var(--gold);
        }

        h2 {
            margin-bottom: 14px;
            color: var(--navy);
            font-family: Georgia, serif;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--navy);
            color: white;
            text-align: left;
        }

        th,
        td {
            padding: 11px 9px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            color: var(--muted);
        }

        .form-row {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text);
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd0d8;
            font-size: 1rem;
        }

        button {
            background: var(--navy);
            color: white;
            border: 2px solid var(--navy);
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--navy);
        }

        @media (max-width: 700px) {
            body {
                padding: 16px;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 18px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <header id="hero">
            <h1>Coding Club</h1>
            <p>Learn. Build. Share.</p>
        </header>
        <div class="content-grid">
            <section class="card">
                <h2>Upcoming Events</h2>
                <table>
                    <tr>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Venue</th>
                    </tr>
                    <tr>
                        <td>HTML Workshop</td>
                        <td>12 Nov</td>
                        <td>Lab 1</td>
                    </tr>
                    <tr>
                        <td>Hackathon</td>
                        <td>20 Nov</td>
                        <td>Seminar Hall</td>
                    </tr>
                </table>
            </section>
            <section class="card">
                <h2>Register</h2>
                <div class="form-row">
                    <label for="name">Name</label>
                    <input id="name" type="text" placeholder="Your name">
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@example.com">
                </div>
                <button type="button">Register</button>
            </section>
        </div>
    </main>
</body>

</html>
