<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6fb;
            color: #172033;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: 220px repeat(4, minmax(0, 1fr));
            grid-template-rows: 88px repeat(2, minmax(170px, 1fr)) 76px;
            gap: 20px;
            width: min(100% - 48px, 1360px);
            min-height: 100vh;
            margin: 0 auto;
            padding: 24px 0;
        }

        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border: 1px solid #e7eaf2;
            border-radius: 20px;
            background: linear-gradient(145deg, #fff, #fbfcff);
            box-shadow: 0 10px 28px rgb(26 39 68 / 7%);
            text-align: center;
        }

        .item h1,
        .item h2 {
            margin: 0;
        }

        .item h1 {
            color: #172033;
            font-size: clamp(2rem, 3vw, 2.6rem);
            font-weight: 700;
            line-height: 1.1;
        }

        .item h2 {
            margin-top: 10px;
            color: #718096;
            font-size: 1rem;
            font-weight: 500;
        }

        .metric-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .metric-icon {
            display: grid;
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            place-items: center;
            border-radius: 15px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 1.45rem;
            line-height: 1;
        }

        .item:first-child {
            grid-column: 1 / -1;
            align-items: flex-start;
            padding: 0 30px;
            border: 0;
            background: linear-gradient(110deg, #172033, #27365c);
            color: #fff;
            text-align: left;
            box-shadow: 0 12px 30px rgb(23 32 51 / 18%);
        }

        .item:first-child h1 {
            color: #fff;
            font-size: 1.65rem;
        }

        .item:nth-child(2) {
            grid-row: 2 / 4;
            align-items: stretch;
            justify-content: flex-start;
            padding: 26px 20px;
            text-align: left;
        }

        .item:nth-child(2) h2 {
            margin: 0 0 18px;
            color: #172033;
            font-size: 1.2rem;
            font-weight: 650;
        }

        .menu {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .menu li {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px;
            border-radius: 10px;
            color: #596579;
            font-size: 0.98rem;
        }

        .menu li::before {
            width: 8px;
            height: 8px;
            flex: 0 0 8px;
            border-radius: 50%;
            background: #8792a8;
            content: "";
        }

        .item:nth-child(4) .metric-icon {
            background: #ecfdf5;
            color: #059669;
        }

        .item:nth-child(5) .metric-icon {
            background: #fff7ed;
            color: #ea580c;
        }

        .item:nth-child(6) .metric-icon {
            background: #fffbeb;
            color: #d97706;
        }

        .item:nth-child(7) .metric-icon {
            background: #fdf2f8;
            color: #db2777;
        }

        .item:nth-child(8) .metric-icon {
            background: #ecfeff;
            color: #0891b2;
        }

        .item:nth-child(9) {
            grid-column: 1 / -1;
            min-height: 76px;
            padding: 16px;
            border: 0;
            background: linear-gradient(110deg, #172033, #27365c);
            color: #cbd5e1;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: 80px;
                grid-auto-rows: minmax(155px, auto);
                gap: 16px;
                width: min(100% - 32px, 720px);
                padding: 16px 0;
            }

            .item:nth-child(2) {
                grid-row: auto;
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 520px) {
            .container {
                grid-template-columns: minmax(0, 1fr);
                gap: 14px;
                width: calc(100% - 28px);
            }

            .item:first-child {
                padding: 0 20px;
            }

            .item {
                min-height: 140px;
                padding: 20px;
            }

            .item:nth-child(2) {
                min-height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"><h1>My Dashboard</h1></div>
        <div class="item">
            <h2>Menu</h2>
            <ul class="menu">
                <li>Home</li>
                <li>Report</li>
                <li>Settings</li>
            </ul>
        </div>
        <div class="item">
            <span class="metric-icon" aria-hidden="true">👥</span>
            <h1>120</h1>
            <h2 class="metric-label">Users</h2>
        </div>
        <div class="item">
            <span class="metric-icon" aria-hidden="true">💰</span>
            <h1>Rs45k</h1>
            <h2 class="metric-label">Sales</h2>
        </div>
        <div class="item">
            <span class="metric-icon" aria-hidden="true">📦</span>
            <h1>36</h1>
            <h2 class="metric-label">Orders</h2>
        </div>
        <div class="item">
            <span class="metric-icon" aria-hidden="true">⭐</span>
            <h1>4.8</h1>
            <h2 class="metric-label">Rating</h2>
        </div>
        <div class="item">
            <span class="metric-icon" aria-hidden="true">💬</span>
            <h1>18</h1>
            <h2 class="metric-label">Messages</h2>
        </div>
        <div class="item">
            <span class="metric-icon" aria-hidden="true">✅</span>
            <h1>92%</h1>
            <h2 class="metric-label">Done</h2>
        </div>
        <div class="item">Made with CSS Grid</div>
        
    </div>
    
</body>
</html>
